services:
  postgres:
    image: postgres:13
    container_name: mcp-postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mcp-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mcp-db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mcp-network

  server:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    container_name: mcp-server
    ports:
      - "3000:3000"
    env_file:
      - ./mcp-server/.env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mcp-network

  client:
    build:
      context: .
      dockerfile: mcp-client/Dockerfile
    container_name: mcp-client
    ports:
      - "3001:80"
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - mcp-network

volumes:
  postgres_data:

networks:
  mcp-network:
    driver: bridge
